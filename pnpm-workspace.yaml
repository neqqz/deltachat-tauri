# This repo is a single package; the workspace file exists for the `catalog:`
# entries below and for pnpm's settings.
#
# `upstream/` is deliberately NOT a workspace member: its packages use their own
# `catalog:` references, which resolve against the workspace root that contains
# them. Keeping it a separate workspace (with its own `pnpm install`) means we
# don't have to mirror the whole upstream catalog here.
packages: []

shellEmulator: true

allowBuilds:
  esbuild: true

overrides:
  # Local dev override: use the @deltachat/jsonrpc-client built from your own
  # core fork instead of the pinned npm release below, so the RPC methods
  # actually called at runtime (e.g. getSelfEncryptionKind/rotateKeypairNow)
  # match your fork's RPC surface. Path is relative to this file; adjust it
  # to wherever you checked out your core fork. Also add the same override
  # in upstream/pnpm-workspace.yaml (deltachat-desktop) so both workspaces
  # agree. Remove this line to go back to the published npm release.
  '@deltachat/jsonrpc-client': 'link:../core/deltachat-jsonrpc/typescript'

# Must match the corresponding entries in upstream/pnpm-workspace.yaml.
# `pnpm check:upstream-version` enforces this.
catalog:
  '@deltachat/jsonrpc-client': 2.59.0
  '@webxdc/types': ^2.1.2
  '@types/node': ^22.15.33

minimumReleaseAgeExclude:
  - '@deltachat/jsonrpc-client'
