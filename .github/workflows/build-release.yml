name: Build Tauri Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which platform(s) to build'
        type: choice
        default: 'linux'
        options:
          - linux
          - windows
          - all
  push:
    branches:
      - '*prepare-release*'

permissions: {}

jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        env:
          # push (release-prep branches) always builds everything;
          # manual runs use the target picked in the dropdown (default: linux)
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
        run: |
          LINUX='{"platform_name":"linux","runner":"ubuntu-latest","label":"x86_64","args":""}'
          WINDOWS='{"platform_name":"windows","runner":"windows-latest","label":"x86_64","args":""}'
          case "$TARGET" in
            linux)   MATRIX="{\"include\":[$LINUX]}" ;;
            windows) MATRIX="{\"include\":[$WINDOWS]}" ;;
            all)     MATRIX="{\"include\":[$LINUX,$WINDOWS]}" ;;
            *)
              echo "Unknown target: $TARGET" >&2
              exit 1
              ;;
          esac
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build-tauri:
    needs: configure
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    # macos release is build on our build machine
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false
          submodules: true

      - name: setup node
        uses: actions/setup-node@v7
        with:
          # Disable cache for release builds.
          # This makes <https://docs.zizmor.sh/audits/#cache-poisoning> happy.
          package-manager-cache: false
          node-version: lts/*

      - name: install dependencies (ubuntu only)
        if: matrix.platform_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: |
          npm i -g pnpm
          pnpm -C upstream install
          pnpm install

      - name: set version ref
        shell: bash
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION_INFO_GIT_REF=v${VERSION}" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@2d793bf2c8c505b9b76211601b09aab48922225d # v1.0.0
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_INFO_GIT_REF: ${{ env.VERSION_INFO_GIT_REF }}
        with:
          projectPath: .
          args: ${{ matrix.args }}

      - name: log paths
        env:
          ARTIFACT_PATHS: ${{ steps.build.outputs.artifactPaths }}
        run: |
          echo "$ARTIFACT_PATHS"

      - name: convert paths
        env:
          ARTIFACT_PATHS: ${{ steps.build.outputs.artifactPaths }}
        run: |
          node -e '
          import fs from "fs";
          const files = JSON.parse(process.env.ARTIFACT_PATHS).join("\n");
          fs.appendFile(process.env.GITHUB_ENV,`UPLOAD_PATHS<<EOF\n${files}\nEOF`, err => {
              if (err){
                console.error("Error appending to GitHub Actions environment file:", err);
                process.exit(1)
              }
          });
          '

      - uses: actions/upload-artifact@v7
        with:
          name: releases-${{ matrix.platform_name }}-${{ matrix.label }}
          path: ${{ env.UPLOAD_PATHS }}
